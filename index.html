<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>แบบทดสอบด่วน IC3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centered answer-sheet column; a progress strip on top, one question card at a time */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#18213a; --muted:#5c6680; --line:#d9dfeb;
  --accent:#2747c9; --accent-soft:#e6ebfb; --ok:#147a4a; --ok-soft:#e2f4ea; --bad:#b4232c; --bad-soft:#fbe7e8;
  --font:"IBM Plex Sans Thai",system-ui,"Leelawadee UI",Tahoma,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1424; --surface:#182036; --ink:#e7ebf5; --muted:#9aa4bd; --line:#2b3552;
  --accent:#8ea4ff; --accent-soft:#232f57; --ok:#5fd39a; --ok-soft:#173a2b; --bad:#ff8a90; --bad-soft:#44202a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1424; --surface:#182036; --ink:#e7ebf5; --muted:#9aa4bd; --line:#2b3552;
  --accent:#8ea4ff; --accent-soft:#232f57; --ok:#5fd39a; --ok-soft:#173a2b; --bad:#ff8a90; --bad-soft:#44202a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{margin:0;font-size:28px;line-height:1.25;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls label{font-size:14px;color:var(--muted)}
select,button{font:inherit}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{padding:10px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.progress{display:flex;gap:4px}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress span.ok{background:var(--ok)} .progress span.bad{background:var(--bad)} .progress span.cur{background:var(--accent)}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.tag{align-self:flex-start;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.q{margin:0;font-size:19px;font-weight:600;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:13px;min-width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .k{background:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.explain{padding:12px 14px;border-radius:10px;background:var(--bg);font-size:15px}
.explain b.ok{color:var(--ok)} .explain b.bad{color:var(--bad)}
.nav{display:flex;justify-content:flex-end}
.result{text-align:center;align-items:center}
.score{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.review{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.review div{padding:10px 12px;border-radius:8px;border-left:4px solid var(--bad);background:var(--bad-soft);font-size:14px}
.foot{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">เตรียมสอบ IC3 · ดิจิทัล + AI</span>
    <h1>แบบทดสอบด่วน</h1>
    <p class="sub">สุ่มข้อและสลับตัวเลือกใหม่ทุกครั้ง ตอบแล้วเห็นเฉลยทันที</p>
  </header>

  <div class="controls">
    <label for="topic">หมวด</label>
    <select id="topic"></select>
    <label for="count">จำนวนข้อ</label>
    <select id="count"><option>5</option><option selected>10</option><option>20</option></select>
    <button class="btn" id="start">สุ่มชุดใหม่</button>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="meta"><span id="pos"></span><span id="live"></span></div>
  <div id="stage"></div>
  <p class="foot" id="best"></p>
</div>

}

function start(){
  const t=$("#topic").value,n=+$("#count").value;
  const pool=BANK.filter(q=>t==="all"||q[0]===t);
  quiz=shuffle(pool).slice(0,Math.min(n,pool.length)).map(q=>{
    const opts=shuffle(q[2].map((text,idx)=>({text,ok:idx===0})));
    return {topic:q[0],q:q[1],opts,ex:q[3],picked:null};
  });
  i=0;score=0;wrong=[];render();
}

function progress(){
  $("#progress").innerHTML=quiz.map((q,idx)=>{
    const c=q.picked===null?(idx===i?"cur":""):(q.opts[q.picked].ok?"ok":"bad");
    return `<span class="${c}"></span>`}).join("");
  $("#pos").textContent=i<quiz.length?`ข้อ ${i+1} / ${quiz.length}`:`ครบ ${quiz.length} ข้อ`;
  $("#live").textContent=`ถูก ${score}`;
}

function render(){
  progress();
  if(i>=quiz.length)return finish();
  const q=quiz[i];
  $("#stage").innerHTML=`<div class="card">
    <span class="tag">${T[q.topic]}</span>
    <p class="q">${q.q}</p>
    <div class="opts">${q.opts.map((o,idx)=>`<button class="opt" id="opt${idx}" data-i="${idx}"><span class="k">${K[idx]}</span><span>${o.text}</span></button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.i)));
}

function pick(idx){
  const q=quiz[i];if(q.picked!==null)return;
  q.picked=idx;const ok=q.opts[idx].ok;if(ok)score++;else wrong.push(q);
  document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add("ok");else if(j===idx)b.classList.add("bad")});
  const right=q.opts.findIndex(o=>o.ok);
  $("#fb").innerHTML=`<div class="explain"><b class="${ok?"ok":"bad"}">${ok?"ถูกต้อง":"ยังไม่ถูก · คำตอบคือ "+K[right]}</b> ${q.ex}</div>
    <div class="nav"><button class="btn" id="next">${i+1<quiz.length?"ข้อถัดไป":"ดูผลคะแนน"}</button></div>`;
  progress();
  const nx=$("#next");nx.focus();nx.addEventListener("click",()=>{i++;render()});
}

function finish(){
  const pct=Math.round(score/quiz.length*100);
  const best=Math.max(pct,+(store.get("ic3best")||0));store.set("ic3best",best);
  const msg=pct>=80?"พร้อมสอบแล้ว":pct>=60?"ใกล้แล้ว ทบทวนข้อที่ผิดอีกรอบ":"ลองทบทวนสรุปแล้วสุ่มชุดใหม่";
  $("#stage").innerHTML=`<div class="card result">
    <div class="score">${score}/${quiz.length}</div>
    <p class="q">${pct}% · ${msg}</p>
    ${wrong.length?`<div class="review">${wrong.map(q=>`<div><b>${q.q}</b><br>คำตอบ: ${q.opts.find(o=>o.ok).text}</div>`).join("")}</div>`:""}
    <button class="btn" id="again">สุ่มชุดใหม่</button>
  </div>`;
  $("#again").addEventListener("click",start);
  showBest();
}
function showBest(){const b=store.get("ic3best");$("#best").textContent=b?`คะแนนดีที่สุดในเครื่องนี้: ${b}%`:""}

initTopics();$("#start").addEventListener("click",start);showBest();start();
</script>

</body></html>
